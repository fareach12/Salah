<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayer Times & Hijri Calendar</title>
<meta name="theme-color" content="#0b4a38">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salah">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2b25;--mu:#6b7a72;--ac:#1f7a5c;--ln:#e3e0d6;--hl:#e4f2ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#17231d;--tx:#e8efe9;--mu:#8fa398;--ac:#4cc79a;--ln:#26362e;--hl:#1d3329}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17231d;--tx:#e8efe9;--mu:#8fa398;--ac:#4cc79a;--ln:#26362e;--hl:#1d3329}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.hijri{font-size:1.5rem;font-weight:700}.greg{color:var(--mu);font-size:.9rem;margin-top:2px}
.next{font-size:.8rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.nn{font-size:1.4rem;font-weight:700;color:var(--ac)}
.row{display:flex;justify-content:space-between;padding:11px 8px;border-radius:10px;font-size:1.05rem}
.row.on{background:var(--hl);color:var(--ac);font-weight:700}.row.past{opacity:.45}.row span:last-child{font-variant-numeric:tabular-nums}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
button{cursor:pointer}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dn{font-size:.7rem;color:var(--mu);padding:4px 0}
.d{padding:6px 0;border-radius:10px;line-height:1.1}.d small{display:block;font-size:.68rem;color:var(--mu)}
.d.t{background:var(--ac);color:#fff}.d.t small{color:#fff}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
.f{display:flex;gap:8px}.f>*{flex:1;min-width:0}
.mu{color:var(--mu);font-size:.8rem;margin-top:8px}
input,select{width:100%;max-width:100%;min-width:0}
.card{overflow:hidden}
.card>b{display:block;margin-bottom:6px}
.card label{margin:12px 0 4px}
#adj,#iqa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#adj>div,#iqa>div{min-width:0}
#adj label,#iqa label{margin:0 0 4px!important}
.f{align-items:flex-end}
.hd button{width:40px;height:40px;padding:0;border-radius:12px}
#times,#vol{padding:12px}
.row{padding:10px 8px}
.sg{display:flex;gap:6px}.sb{flex:none;width:40px;padding:0;font-size:1.2rem;font-weight:700;color:var(--ac)}
.act{background:var(--ac);color:#fff;border-color:var(--ac)}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--ac);font-size:1.4rem;line-height:1}
details[open]>summary::after{content:"\2212"}
details[open]>summary{margin-bottom:10px}
#vol{padding:0!important}
table{border-collapse:collapse;width:100%;font-size:.78rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600}td:first-child{text-align:left;font-weight:600}td small{color:var(--mu);font-weight:400}
tr.td{background:var(--hl);color:var(--ac)}
@media print{body{background:#fff}main>*{display:none!important}main>#tt{display:block!important;border:0;box-shadow:none;color:#000}#tt .hd button,#tpr{display:none}}
:root{--g1:#0b4a38;--g2:#1c8a64;--gold:#e8c25a}
body{background:radial-gradient(700px 380px at 50% -90px,rgba(28,138,100,.24),transparent 70%),var(--bg);font-family:"Avenir Next",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:14px 14px 100px}
.card{border-radius:22px;box-shadow:0 6px 22px rgba(8,50,36,.08)}
main>.card:first-child{background:linear-gradient(160deg,var(--g1),#127050);color:#fff;border:0;border-radius:26px 26px 0 0;margin-bottom:0;padding:18px 18px 8px;position:relative;overflow:hidden;box-shadow:none}
main>.card:first-child::after{content:"\1F54C";position:absolute;right:12px;bottom:-6px;font-size:4.8rem;opacity:.16}
.pill{display:inline-block;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-size:.85rem;margin-bottom:10px}
.hijri{font-size:1.3rem;font-weight:700}.greg{color:rgba(255,255,255,.75)}
main>.card:nth-child(2){background:linear-gradient(160deg,#127050,var(--g2));color:#fff;border:0;border-radius:0 0 26px 26px;padding:6px 18px 22px;display:flex;flex-direction:column;position:relative}
main>.card:nth-child(2)>div:not([class]){display:contents}
main>.card:nth-child(2) .next{order:0;color:rgba(255,255,255,.7)}
main>.card:nth-child(2) .nn{order:1;font-size:1.2rem;font-weight:700;color:var(--gold)}
.bigt{order:2;font-size:3rem;font-weight:800;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
#dv{background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:4px;gap:4px}
#dv button{border:0;background:transparent;border-radius:999px;padding:8px}
#dv .act{background:var(--ac);color:#fff}
#times{padding:6px 10px}
#times .row{align-items:center;justify-content:flex-start;padding:10px 8px;border-radius:16px;font-size:1.05rem}
#times .row span:first-of-type{flex:1;font-weight:600}
#times .row>span:nth-of-type(2){font-weight:700}
#times .row.on{background:var(--hl);color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mu);padding:4px 0;border-radius:12px}
#nav button i{font-style:normal;font-size:1.35rem}
#nav button.on{color:var(--ac);font-weight:700}
@property --h1{syntax:'<color>';inherits:true;initial-value:#0b4a38}
@property --hm{syntax:'<color>';inherits:true;initial-value:#127050}
@property --h2{syntax:'<color>';inherits:true;initial-value:#1c8a64}
:root{--h1:#0b4a38;--hm:#127050;--h2:#1c8a64;transition:--h1 2s,--hm 2s,--h2 2s}
main>.card:first-child{background:linear-gradient(160deg,var(--h1),var(--hm))}
main>.card:nth-child(2){background:linear-gradient(160deg,var(--hm),var(--h2));display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:start}
main>.card:nth-child(2) .next,main>.card:nth-child(2) .nn,main>.card:nth-child(2) .bigt{grid-column:1}
main>.card:nth-child(2) .nn{color:#fff;opacity:.95}
.bigt{font-size:2.8rem}
.ring{grid-column:2;grid-row:1/4;align-self:center;position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb,.rf{fill:none;stroke-width:7}.rb{stroke:rgba(255,255,255,.2)}.rf{stroke:#fff;stroke-linecap:round;transition:stroke-dasharray .9s linear}
.rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rt b{font-size:1.05rem;color:#fff;font-variant-numeric:tabular-nums}.rt small{font-size:.66rem;color:rgba(255,255,255,.75)}
.ic,.nic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic{width:38px;height:38px;padding:8px;border-radius:50%;background:var(--hl);color:var(--ac);flex:none;margin-inline-end:12px}
.nic{width:26px;height:26px}
#nav button i{font-size:0;display:block}
button,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-Fajr" viewBox="0 0 24 24"><path d="M19 13.5A7 7 0 1 1 9 4a5.5 5.5 0 0 0 10 9.5z M3 20h18"/></symbol>
<symbol id="i-Sunrise" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 4v6 M9.5 6.5L12 4l2.5 2.5"/></symbol>
<symbol id="i-Dhuhr" viewBox="0 0 24 24"><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-Asr" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 8v2 M5.5 12l1.5 1.2 M18.5 12l-1.5 1.2"/></symbol>
<symbol id="i-Maghrib" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 4v6 M9.5 7.5L12 10l2.5-2.5"/></symbol>
<symbol id="i-Isha" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z M17 3v3 M15.5 4.5h3"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8 M5 10v10h14V10 M10 20v-6h4v6"/></symbol>

</defs></svg>
<main>
 <div class="card">
  <div class="pill" id="cp"></div>
  <div class="hijri" id="hj">…</div><div class="greg" id="gr"></div>
 </div>
 <div class="card">
  <div class="next">Next prayer</div>
  <div class="bigt" id="nt"></div>
  <div class="ring"><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="44"/><circle class="rf" id="rf" cx="50" cy="50" r="44" stroke-dasharray="276.5 276.5"/></svg><div class="rt"><b id="rh"></b><small>left</small></div></div>
  <div><span class="nn" id="nn">—</span></div>
 </div>
 <div class="f" id="dv" style="margin-bottom:10px"><button data-o="0" class="act">Today</button><button data-o="1">Tomorrow</button></div>
 <div class="card" id="times"></div>
 <details class="card" open><summary>Voluntary prayers</summary><div id="vol"></div></details>
 <details class="card" open><summary>Fasting</summary><div id="fs"></div></details>
 <details class="card" id="evd"><summary>Islamic events</summary><div id="ev"></div></details>
 <details class="card" id="qb"><summary>Qibla</summary>
  <div style="text-align:center">
   <div style="position:relative;width:180px;height:180px;margin:10px auto;border:2px solid var(--ln);border-radius:50%">
    <div id="arr" style="position:absolute;inset:0;transition:transform .2s"><div style="position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:1.6rem">🕋</div><div style="position:absolute;left:50%;top:42px;bottom:50%;width:3px;margin-left:-1.5px;background:var(--ac);border-radius:2px"></div></div>
    <div style="position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--ac)"></div>
   </div>
   <div id="qd" style="font-weight:700"></div>
   <div id="qh" class="mu"></div>
   <button id="qc" type="button" style="margin-top:10px">Enable compass</button>
  </div>
 </details>
 <details class="card"><summary>Hijri calendar</summary>
  <div class="hd"><button id="pv" type="button" aria-label="Previous month">‹</button><b id="mt"></b><button id="nx" type="button" aria-label="Next month">›</button></div>
  <div class="g" id="cal"></div>
 </details>
 <details class="card" id="tt"><summary>Monthly timetable</summary>
  <div class="hd"><button id="tp" type="button" aria-label="Previous month">&lsaquo;</button><b id="ttm"></b><button id="tn" type="button" aria-label="Next month">&rsaquo;</button></div>
  <div id="ttb" style="overflow-x:auto"></div>
  <button id="tpr" type="button" style="margin-top:10px">Print</button>
 </details>
 <details class="card"><summary>Settings</summary>
  <details class="adv"><summary style="font-weight:400;color:var(--mu);font-size:.85rem">Advanced: coordinates</summary><div class="f">
   <div><label>Latitude</label><input id="lat" type="number" step="any" inputmode="decimal"></div>
   <div><label>Longitude</label><input id="lng" type="number" step="any" inputmode="decimal"></div>
  </div></details>
  <label>City (type to search)</label><input id="city" list="cl" placeholder="e.g. London" style="width:100%" autocomplete="off"><datalist id="cl"></datalist>
  <button id="loc" type="button" style="margin-top:8px;width:100%">Use my location</button><div class="mu" id="locs"></div>
  <label>Calculation method</label>
  <select id="me" style="width:100%">
   <option value="MWL">Muslim World League</option>
   <option value="Egypt">Egyptian General Authority</option>
   <option value="Makkah">Umm al-Qura (Makkah)</option>
   <option value="ISNA">ISNA (North America)</option>
   <option value="Karachi">Karachi</option>
  </select>
  <div class="f">
   <div><label>Asr</label><select id="as"><option value="1">Standard</option><option value="2">Hanafi</option></select></div>
   <div><label>Clock</label><select id="fm"><option value="12">12-hour</option><option value="24">24-hour</option></select></div>
  </div>
  <label>Language</label>
  <select id="lg"><option value="en">English</option><option value="so">Soomaali</option><option value="ar">العربية</option></select>
  <label>Theme</label>
  <select id="th"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <label>Hijri date adjustment</label>
  <select id="ha"><option value="-1">−1 day</option><option value="0">None</option><option value="1">+1 day</option></select>
  <label>Fine-tune minutes (to match your local mosque)</label>
  <div class="f" id="adj" style="flex-wrap:wrap"></div>
  <label>Iqama: minutes after adhan (0 = hide)</label>
  <div class="f" id="iqa" style="flex-wrap:wrap"></div>
 </details>
<nav id="nav"><button data-t="home" class="on"><i>🏠</i><span>Home</span></button><button data-t="qibla"><i>🧭</i><span>Qibla</span></button><button data-t="cal"><i>📅</i><span>Calendar</span></button><button data-t="set"><i>⚙️</i><span>Settings</span></button></nav>
</main>
<script>
const $=id=>document.getElementById(id);
const S={city:'Borama (Awdal)',lat:9.9361,lng:43.1828,me:'MWL',as:1,fm:'12'};
try{Object.assign(S,JSON.parse(localStorage.getItem('pt')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pt',JSON.stringify(S))}catch(e){}};
const M={MWL:[18,17],ISNA:[15,15],Egypt:[19.5,17.5],Makkah:[18.5,'90'],Karachi:[18,18]};
const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R);
const asin=x=>Math.asin(x)/R,acos=x=>Math.acos(x)/R,acot=x=>Math.atan(1/x)/R,atan2=(y,x)=>Math.atan2(y,x)/R;
const fa=a=>((a%360)+360)%360,fh=h=>((h%24)+24)%24;
function sun(jd){const D=jd-2451545,g=fa(357.529+.98560028*D),q=fa(280.459+.98564736*D),
L=fa(q+1.915*sin(g)+.02*sin(2*g)),e=23.439-3.6e-7*D,RA=fh(atan2(cos(e)*sin(L),cos(L))/15);
return{d:asin(sin(e)*sin(L)),eq:q/15-RA}}
function calc(date){
 const{lat,lng}=S,[fj,ish]=M[S.me],tz=-date.getTimezoneOffset()/60;
 const jd0=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/864e5+2440587.5-lng/360;
 const noon=t=>fh(12-sun(jd0+t).eq);
 const ang=(a,t,ccw)=>{const s=sun(jd0+t),v=acos((-sin(a)-sin(s.d)*sin(lat))/(cos(s.d)*cos(lat)))/15;
  return noon(t)+(ccw?-v:v)};
 const asr=(t)=>{const s=sun(jd0+t);return ang(-acot(S.as+tan(Math.abs(lat-s.d))),t)};
 const adj=h=>h+tz-lng/15;
 const mg=adj(ang(.833,18/24));
 const T={Fajr:adj(ang(fj,5/24,1)),Sunrise:adj(ang(.833,6/24,1)),Dhuhr:adj(noon(.5))+1/60,
  Asr:adj(asr(15/24)),Maghrib:mg,Isha:ish==='90'?mg+(hp(addDays(date,1)).month===9?2:1.5):adj(ang(ish,18/24))};
 const nl=fh(T.Sunrise-T.Maghrib),lim=a=>a/60*nl;
 {const d=fh(T.Sunrise-T.Fajr);if(isNaN(d)||d>lim(fj))T.Fajr=T.Sunrise-lim(fj)}
 if(ish!=='90'){const d=fh(T.Isha-T.Maghrib);if(isNaN(d)||d>lim(ish))T.Isha=T.Maghrib+lim(ish)}
 return T}
const toDate=(base,h)=>isNaN(h)?null:new Date(new Date(base.getFullYear(),base.getMonth(),base.getDate()).getTime()+Math.round(h*3600)*1000);
const fmt=d=>{if(!d)return'—';let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');
 if(S.fm==='24')return String(h).padStart(2,'0')+':'+m;const p=h<12?'AM':'PM';h=h%12||12;return h+':'+m+' '+p};
const HM=['Muharram','Safar','Rabiʻ I','Rabiʻ II','Jumada I','Jumada II','Rajab','Shaʻban','Ramadan','Shawwal','Dhu al-Qiʻdah','Dhu al-Hijjah'];
const hf=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'});
const hp=d=>{const o={};hf.formatToParts(S.ha?addDays(d,S.ha):d).forEach(p=>o[p.type]=parseInt(p.value));return o};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
let anchor=new Date(),hOff=0;
let lastDay='';
function render(){
 const now=new Date(),T=calc(now),names=Object.keys(T);
 const ad=n=>((S.adj&&S.adj[n])||0)/60;
  const iqS=(n,i)=>{const m=(S.iq&&S.iq[n])||0;if(!m||!ds[i])return'';const q=new Date(ds[i].getTime()+m*6e4);const w=ds[i]<=now&&now<q?` · in ${Math.ceil((q-now)/6e4)} min`:'';return `<small style="display:block;text-align:right;font-size:.72rem;font-weight:400;opacity:.75">Iqama ${fmt(q)}${w}</small>`};
 const ds=names.map(n=>toDate(now,T[n]+ad(n)));
 hOff=ds[4]&&now>=ds[4]?1:0;
 const ni=ds.findIndex(d=>d&&d>now);
 let nextName,nextDate;
 if(ni<0){const tm=calc(addDays(now,1));nextName='Fajr';nextDate=toDate(addDays(now,1),tm.Fajr+ad('Fajr'))}else{nextName=names[ni];nextDate=ds[ni]}
 const dy=(k,x)=>{const b=addDays(now,k);return toDate(b,calc(b)[x]+ad(x))};
 const pre=ds[0]&&now<ds[0];
 const mS=pre?dy(-1,'Maghrib'):ds[4],mE=pre?ds[0]:dy(1,'Fajr');
 const mid=mS&&mE?new Date(mS.getTime()+(mE-mS)/2):null;
 const asrEnd=ds[4]?new Date(ds[4].getTime()-20*6e4):null;
 let ci=-1,late=false;
 if(pre)ci=5;
 else [[0,ds[0],ds[1]],[2,ds[2],ds[3]],[3,ds[3],asrEnd],[4,ds[4],ds[5]],[5,ds[5],mE]].forEach(([i,a,b])=>{if(a&&b&&now>=a&&now<b)ci=i});
 if(ci===5&&mid&&now>=mid)late=true; // after Islamic midnight: permissible until Fajr
 $('times').innerHTML=names.map((n,i)=>`<div class="row${i===ci?' on':''}${ds[i]&&ds[i]<=now&&i!==ci?' past':''}"><svg class="ic"><use href="#i-${n}"/></svg><span>${n}${i===ci?(late?' · now (late)':' · now'):''}</span><span>${fmt(ds[i])}${iqS(n,i)}</span></div>`).join('');
 $('nn').textContent=nextName;
 if(ds[0]&&ds[1]&&ds[2]&&ds[4]){
  const dayF=(k,x)=>{const b=addDays(now,k);return toDate(b,calc(b)[x]+ad(x))};
