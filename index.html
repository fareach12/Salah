<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayer Times & Hijri Calendar</title>
<meta name="theme-color" content="#0b4a38">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salah">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/tools.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/quran.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-Fajr" viewBox="0 0 24 24"><path d="M19 13.5A7 7 0 1 1 9 4a5.5 5.5 0 0 0 10 9.5z M3 20h18"/></symbol>
<symbol id="i-Sunrise" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 4v6 M9.5 6.5L12 4l2.5 2.5"/></symbol>
<symbol id="i-Dhuhr" viewBox="0 0 24 24"><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-Asr" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 8v2 M5.5 12l1.5 1.2 M18.5 12l-1.5 1.2"/></symbol>
<symbol id="i-Maghrib" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 4v6 M9.5 7.5L12 10l2.5-2.5"/></symbol>
<symbol id="i-Isha" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z M17 3v3 M15.5 4.5h3"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8 M5 10v10h14V10 M10 20v-6h4v6"/></symbol>
<symbol id="i-qibla" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M16 8l-2 6-6 2 2-6z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4"/></symbol>
<symbol id="i-tools" viewBox="0 0 24 24"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></symbol>
<symbol id="i-quran" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13C17 4 14 4.5 12 6z M12 6v13"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h10 M18 7h2 M4 17h2 M10 17h10 M16 5v4 M8 15v4"/></symbol>
</defs></svg>
<main>
 <div class="card" data-tab="home">
  <div class="pill" id="cp"></div>
  <div class="hijri" id="hj">…</div><div class="greg" id="gr"></div>
 </div>
 <div class="card" data-tab="home">
  <div class="next">Next prayer</div>
  <div class="bigt" id="nt"></div>
  <div class="ring"><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="44"/><circle class="rf" id="rf" cx="50" cy="50" r="44" stroke-dasharray="276.5 276.5"/></svg><div class="rt"><b id="rh"></b><small>left</small></div></div>
  <div><span class="nn" id="nn">—</span></div>
 </div>
 <div class="f" id="dv" data-tab="home" style="margin-bottom:10px"><button data-o="0" class="act">Today</button><button data-o="1">Tomorrow</button></div>
 <div class="card" id="times" data-tab="home"></div>
 <details class="card" open data-tab="home"><summary>Voluntary prayers</summary><div id="vol"></div></details>
 <details class="card" open data-tab="home"><summary>Fasting</summary><div id="fs"></div></details>
 <details class="card" open data-tab="cal" id="evd"><summary>Islamic events</summary><div id="ev"></div></details>
 <details class="card" open data-tab="qibla" id="qb"><summary>Qibla</summary>
  <div style="text-align:center">
   <div style="position:relative;width:180px;height:180px;margin:10px auto;border:2px solid var(--ln);border-radius:50%">
    <div id="arr" style="position:absolute;inset:0;transition:transform .2s"><div style="position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:1.6rem">🕋</div><div style="position:absolute;left:50%;top:42px;bottom:50%;width:3px;margin-left:-1.5px;background:var(--ac);border-radius:2px"></div></div>
    <div style="position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--ac)"></div>
   </div>
   <div id="qd" style="font-weight:700"></div>
   <div id="qh" class="mu"></div>
   <button id="qc" type="button" style="margin-top:10px">Enable compass</button>
  </div>
 </details>
 <details class="card" open data-tab="cal"><summary>Hijri calendar</summary>
  <div class="hd"><button id="pv" type="button" aria-label="Previous month">‹</button><b id="mt"></b><button id="nx" type="button" aria-label="Next month">›</button></div>
  <div class="g" id="cal"></div>
 </details>
 <details class="card" open data-tab="cal" id="tt"><summary>Monthly timetable</summary>
  <div class="hd"><button id="tp" type="button" aria-label="Previous month">&lsaquo;</button><b id="ttm"></b><button id="tn" type="button" aria-label="Next month">&rsaquo;</button></div>
  <div id="ttb" style="overflow-x:auto"></div>
  <button id="tpr" type="button" style="margin-top:10px">Print</button>
 </details>
 <details class="card" open data-tab="set"><summary>Settings</summary>
  <details><summary style="font-weight:400;color:var(--mu);font-size:.85rem">Advanced: coordinates</summary><div class="f">
   <div><label>Latitude</label><input id="lat" type="number" step="any" inputmode="decimal"></div>
   <div><label>Longitude</label><input id="lng" type="number" step="any" inputmode="decimal"></div>
  </div></details>
  <label>City (type to search)</label><select id="city" style="width:100%"></select>
  <button id="loc" type="button" style="margin-top:8px;width:100%">Use my location</button><div class="mu" id="locs"></div>
  <label>Calculation method</label>
  <select id="me" style="width:100%">
   <option value="MWL">Muslim World League</option>
   <option value="Egypt">Egyptian General Authority</option>
   <option value="Makkah">Umm al-Qura (Makkah)</option>
   <option value="ISNA">ISNA (North America)</option>
   <option value="Karachi">Karachi</option>
  </select>
  <div class="f">
   <div><label>Asr</label><select id="as"><option value="1">Standard</option><option value="2">Hanafi</option></select></div>
   <div><label>Clock</label><select id="fm"><option value="12">12-hour</option><option value="24">24-hour</option></select></div>
  </div>
  <label>Language</label>
  <select id="lg"><option value="en">English</option><option value="so">Soomaali</option><option value="ar">العربية</option></select>
  <label>Theme</label>
  <select id="th"><option value="auto">Auto</option><optgroup label="Light"><option value="light">Light</option><option value="sand">Sand</option></optgroup><optgroup label="Dark"><option value="dark">Dark</option><option value="midnight">Midnight</option><option value="amethyst">Amethyst</option><option value="espresso">Espresso</option><option value="black">Black (OLED)</option></optgroup></select>
  <label>Hijri date adjustment</label>
  <select id="ha"><option value="-1">−1 day</option><option value="0">None</option><option value="1">+1 day</option></select>
  <label>Fine-tune minutes (to match your local mosque)</label>
  <div id="adj"></div>
  <label>Iqama: minutes after adhan (0 = hide)</label>
  <div id="iqa"></div>
 </details>
<details class="card" open data-tab="tools"><summary>Reminders</summary>
 <div class="mu">Alerts show while the app is open or was used recently. Alerts with the app fully closed need the native app.</div>
 <label>Minutes · before or after · prayer</label><div class="f"><input id="rm" type="number" min="0" max="180" value="15" inputmode="numeric" style="width:70px"><select id="rd"><option value="-1">before</option><option value="1">after</option></select><select id="rp"><option value="Fajr">Fajr</option><option value="Sunrise">Sunrise</option><option value="Dhuhr">Dhuhr / Jumu’ah</option><option value="Asr">Asr</option><option value="Maghrib">Maghrib</option><option value="Isha">Isha</option></select></div>
 <input id="rl" placeholder="Label (e.g. Read Quran)" maxlength="40" style="width:100%;margin-top:8px">
 <button id="ra" type="button" style="margin-top:8px;width:100%">Add reminder</button>
 <button id="rn" type="button" style="margin-top:8px;width:100%"></button>
 <div id="rls" class="mu" style="margin-top:8px"></div>
</details>
<details class="card" open data-tab="tools"><summary>Age calculator</summary>
 <label>I know the birth date in:</label>
 <div class="f" id="agt"><button type="button" data-c="g" class="act">Gregorian</button><button type="button" data-c="h">Hijri</button></div>
 <div class="f" style="margin-top:10px"><select id="agd" aria-label="Day"></select><select id="agm" aria-label="Month" style="flex:1.6"></select><input id="agy" type="number" inputmode="numeric" placeholder="Year" aria-label="Year" style="flex:1.2"></div>
 <label>Age on (Gregorian date, default today)</label><div class="f"><input id="ag2" type="date"><button id="agn" type="button" style="flex:0 0 auto">Today</button></div>
 <div id="ago" style="margin-top:12px"></div>
 <label>Save this person (their age updates by itself every day)</label>
 <div class="f"><input id="agname" placeholder="Name (e.g. Me, Amina)" maxlength="30" autocomplete="off"><button id="agsv" type="button" style="flex:0 0 auto">Save</button></div>
 <div id="agms" class="mu"></div>
 <label>Saved people</label>
 <div id="agpl"></div>
</details>
<div id="qr" data-tab="quran"></div>
<nav id="nav"><button data-t="home" class="on"><i><svg class="nic"><use href="#i-home"/></svg></i><span>Home</span></button><button data-t="quran"><i><svg class="nic"><use href="#i-quran"/></svg></i><span>Quran</span></button><button data-t="qibla"><i><svg class="nic"><use href="#i-qibla"/></svg></i><span>Qibla</span></button><button data-t="cal"><i><svg class="nic"><use href="#i-cal"/></svg></i><span>Calendar</span></button><button data-t="tools"><i><svg class="nic"><use href="#i-tools"/></svg></i><span>Tools</span></button><button data-t="set"><i><svg class="nic"><use href="#i-set"/></svg></i><span>Settings</span></button></nav>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
