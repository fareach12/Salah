<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayer Times & Hijri Calendar</title>
<meta name="theme-color" content="#0b4a38">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salah">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2b25;--mu:#6b7a72;--ac:#1f7a5c;--ln:#e3e0d6;--hl:#e4f2ec;--gold:#e8c25a;--glow:rgba(28,138,100,.24);--h1:#0b4a38;--hm:#127050;--h2:#1c8a64;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:--h1 2s,--hm 2s,--h2 2s}
@property --h1{syntax:'<color>';inherits:true;initial-value:#0b4a38}
@property --hm{syntax:'<color>';inherits:true;initial-value:#127050}
@property --h2{syntax:'<color>';inherits:true;initial-value:#1c8a64}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0f1713;--card:#17231d;--tx:#e8efe9;--mu:#8fa398;--ac:#4cc79a;--ln:#26362e;--hl:#1d3329}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17231d;--tx:#e8efe9;--mu:#8fa398;--ac:#4cc79a;--ln:#26362e;--hl:#1d3329}
:root[data-theme="sand"]{--bg:#f3e9d7;--card:#fbf5e9;--tx:#3a2e1f;--mu:#86765f;--ac:#8a5a12;--ln:#e2d3b8;--hl:#f1e2c0;--glow:rgba(224,166,58,.24)}
:root[data-theme="midnight"]{color-scheme:dark;--bg:#0b1220;--card:#131c2f;--tx:#e6ecf7;--mu:#8c9ab5;--ac:#5b9cf0;--ln:#22304a;--hl:#1a2a47;--glow:rgba(80,130,220,.24)}
:root[data-theme="espresso"]{color-scheme:dark;--bg:#1a120d;--card:#251a13;--tx:#f0e4d6;--mu:#a8917a;--ac:#e0a63a;--ln:#3a2a1f;--hl:#3a2a17;--glow:rgba(224,166,58,.16)}
:root[data-theme="amethyst"]{color-scheme:dark;--bg:#140f21;--card:#1e1733;--tx:#ece6fa;--mu:#a095c2;--ac:#a98bff;--ln:#2f2650;--hl:#2a2150;--glow:rgba(140,100,230,.22)}
:root[data-theme="black"]{color-scheme:dark;--bg:#000;--card:#0c0c0c;--tx:#ececec;--mu:#8a8a8a;--ac:#4cc79a;--ln:#222;--hl:#10241b;--glow:rgba(28,138,100,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overscroll-behavior:none}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(700px 380px at 50% -90px,var(--glow),transparent 70%),var(--bg);background-repeat:no-repeat;color:var(--tx);font-family:"Avenir Next",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:text;user-select:text}
main{max-width:480px;margin:0 auto;padding:14px 14px 100px}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
button{cursor:pointer}
button,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,summary,#nav,.pill{-webkit-user-select:none;user-select:none}
input,select{width:100%;max-width:100%;min-width:0;-webkit-user-select:text;user-select:text}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 22px rgba(8,50,36,.08)}
.card>b{display:block;margin-bottom:6px}
.card label{margin:12px 0 4px}
.mu{color:var(--mu);font-size:.8rem;margin-top:8px}
.sm{display:block;text-align:right;font-size:.72rem;font-weight:400;opacity:.75}.sm.l{text-align:left}
.f{display:flex;gap:8px;align-items:flex-end}.f>*{flex:1;min-width:0}
.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd button{width:40px;height:40px;padding:0;border-radius:12px}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--ac);font-size:1.4rem;line-height:1}
details[open]>summary::after{content:"\2212"}
details[open]>summary{margin-bottom:10px}
/* hero */
main>.card:first-child{background:linear-gradient(160deg,var(--h1),var(--hm));color:#fff;border:0;border-radius:26px 26px 0 0;margin-bottom:0;padding:18px 18px 8px;position:relative;box-shadow:none}
main>.card:first-child::after{content:"\1F54C";position:absolute;right:12px;bottom:-6px;font-size:4.8rem;opacity:.16}
.pill{display:inline-block;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-size:.85rem;margin-bottom:10px}
.hijri{font-size:1.3rem;font-weight:700}
.greg{color:rgba(255,255,255,.75);font-size:.9rem;margin-top:2px}
main>.card:nth-child(2){background:linear-gradient(160deg,var(--hm),var(--h2));color:#fff;border:0;border-radius:0 0 26px 26px;padding:6px 18px 22px;position:relative;display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:start}
main>.card:nth-child(2)>div:not([class]){display:contents}
.next,.nn,.bigt{grid-column:1}
.next{font-size:.8rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.06em}
.nn{order:1;font-size:1.2rem;font-weight:700;color:#fff;opacity:.95}
.bigt{order:2;font-size:2.8rem;font-weight:800;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.ring{grid-column:2;grid-row:1/4;align-self:center;position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb,.rf{fill:none;stroke-width:7}.rb{stroke:rgba(255,255,255,.2)}.rf{stroke:#fff;stroke-linecap:round;transition:stroke-dasharray .9s linear}
.rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rt b{font-size:1.05rem;color:#fff;font-variant-numeric:tabular-nums}.rt small{font-size:.66rem;color:rgba(255,255,255,.75)}
/* Today / Tomorrow switch and calendar-system switch */
#dv,#agt{background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:4px;gap:4px}
#agt{margin-top:10px}
#dv button,#agt button{border:0;background:transparent;border-radius:999px;padding:8px}
#dv .act,#agt .act{background:var(--ac);color:#fff}
/* prayer rows */
.row{display:flex;justify-content:space-between;padding:10px 8px;border-radius:10px;font-size:1.05rem}
.row.on{background:var(--hl);color:var(--ac);font-weight:700}.row.past{opacity:.45}.row span:last-child{font-variant-numeric:tabular-nums}
#times{padding:6px 10px}
#vol{padding:0}
#times .row{align-items:center;justify-content:flex-start;border-radius:16px}
#times .row span:first-of-type{flex:1;font-weight:600}
#times .row>span:nth-of-type(2){font-weight:700}
#times .row.on{box-shadow:inset 0 0 0 1.5px var(--ac)}
.ic,.nic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic{width:38px;height:38px;padding:8px;border-radius:50%;background:var(--hl);color:var(--ac);flex:none;margin-inline-end:12px}
.nic{width:26px;height:26px}
/* Sunrise is not a prayer: its own gold-tinted row */
#times .row.sr{margin:4px 10px;padding:9px 12px;font-size:1rem;font-weight:400;color:var(--tx);background:rgba(232,194,90,.14);border:1px dashed var(--ln);border-radius:14px;box-shadow:inset 3px 0 0 var(--gold)}
#times .row.sr.past{opacity:.8}
#times .row.sr span:first-of-type,#times .row.sr>span:nth-of-type(2){font-weight:500;letter-spacing:.02em}
#times .row.sr .ic{background:rgba(232,194,90,.28);color:#b8860b}
@media(prefers-color-scheme:dark){:root:not([data-theme]) #times .row.sr .ic{color:var(--gold)}}
:root[data-theme="dark"] #times .row.sr .ic,:root[data-theme="midnight"] #times .row.sr .ic,:root[data-theme="amethyst"] #times .row.sr .ic,:root[data-theme="espresso"] #times .row.sr .ic,:root[data-theme="black"] #times .row.sr .ic{color:var(--gold)}
/* calendar */
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dn{font-size:.7rem;color:var(--mu);padding:4px 0}
.d{padding:6px 0;border-radius:10px;line-height:1.1}.d small{display:block;font-size:.68rem;color:var(--mu)}
.d.t{background:var(--ac);color:#fff}.d.t small{color:#fff}
:root[data-theme="amethyst"] .d.t,:root[data-theme="amethyst"] .d.t small,:root[data-theme="amethyst"] .act,:root[data-theme="espresso"] .d.t,:root[data-theme="espresso"] .d.t small,:root[data-theme="espresso"] .act{color:#10131a!important}
/* tables, settings, tools */
table{border-collapse:collapse;width:100%;font-size:.78rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600}td:first-child{text-align:left;font-weight:600}td small{color:var(--mu);font-weight:400}
#tt th:nth-child(3),#tt td:nth-child(3){color:var(--mu);font-weight:400}
tr.td{background:var(--hl);color:var(--ac)}
#adj,#iqa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#adj>div,#iqa>div{min-width:0}
#adj label,#iqa label{margin:0 0 4px!important}
.sg{display:flex;gap:6px}.sb{flex:none;width:40px;padding:0;font-size:1.2rem;font-weight:700;color:var(--ac)}
#ago .row{flex-direction:column;gap:2px;padding:7px 8px}#ago .row span:first-child{color:var(--mu);font-size:.8rem}#ago .row span:last-child{font-weight:600}
/* bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mu);padding:4px 0;border-radius:12px}
#nav button i{font-style:normal;font-size:0;display:block}
#nav button.on{color:var(--ac);font-weight:700}
@media print{body{background:#fff}main>*{display:none!important}main>#tt{display:block!important;border:0;box-shadow:none;color:#000}#tt .hd button,#tpr{display:none}}
@media(min-width:700px){
main{max-width:680px;padding:24px 20px 110px}
#nav{justify-content:center;gap:8px}
#nav button{flex:0 1 120px}
}
@media(min-width:1000px){
main{max-width:1120px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-items:start;padding:28px 28px 110px}
main>.card:first-child,main>.card:nth-child(2),#dv{grid-column:1/-1}
#dv{width:100%;max-width:340px;justify-self:center;margin-bottom:16px}
main>.card:nth-child(2){padding:10px 28px 28px}
.bigt{font-size:3.4rem}
.ring{width:130px;height:130px}
#times{grid-column:1;grid-row:4/span 2}
#times .row{padding:12px 10px}
main>[data-tab=home]:nth-child(5){grid-column:2;grid-row:4}
main>[data-tab=home]:nth-child(6){grid-column:2;grid-row:5}
main>#tt{grid-column:1/-1}
main>[data-tab=qibla],main>[data-tab=set]{grid-column:1/-1;width:100%;max-width:640px;justify-self:center}
}
/* Quran */
#qr{--gd:#b8892b;--qar:"Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Al Nile",serif;margin-bottom:14px}
#qr h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:18px;margin:22px 0 10px}
#qr .big{font:600 72px/1 Georgia,serif;color:var(--ac)}
#qr .qrow{display:flex;gap:10px;align-items:center}#qr .qrow>*{flex:1}
#qr .qrow>.card{min-width:0;padding:12px}
#qr .mut{color:var(--mu);font-size:.85rem}#qr .gd{color:var(--gd);font-weight:600}
#qr button{width:100%;background:var(--ac);color:#fff;border:0;font-weight:600;transition:background-color .15s,transform .1s,border-color .15s}
#qr button:active{transform:scale(.98)}
#qr button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#qr button.x{width:auto;padding:4px 10px;background:transparent;color:var(--mu);border:1px solid var(--ln);font-weight:400;flex:none;margin-top:2px}
#qr .f{gap:6px}
#qr .f button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:400;padding:9px 2px;font-size:.82rem;white-space:nowrap}
#qr .f button.act{background:var(--ac);color:#fff;border-color:var(--ac)}
#qr textarea{width:100%;height:110px;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px}
#qr select{text-overflow:ellipsis}
#qr :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#qr .qcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
#qr .qcal .qhd{text-align:center;color:var(--mu);font-size:.75rem;padding:2px 0}
#qr .qcal button.qd{width:100%;min-width:0;aspect-ratio:1/1.1;padding:2px 0;border-radius:12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:500;font-size:.95rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#qr .qcal button.qd:active{transform:scale(.93)}
#qr .qcal button.qd small{font-size:.62rem;font-weight:700;opacity:.85}
#qr .qcal button.qd small.qh{font-weight:400;opacity:.65}
#qr .qcal button.qd.some{border-color:var(--gd)}
#qr .qcal button.qd.l1{background:var(--hl)}
#qr .qcal button.qd.l2{background:color-mix(in srgb,var(--ac) 45%,var(--card));color:var(--tx)}
#qr .qcal button.qd.l3{background:var(--ac);color:#fff;border-color:var(--ac)}
#qr .qcal button.qd.today{border:2px solid var(--gd)}
#qr .qcal button.qd.sel{outline:2px solid var(--tx);outline-offset:-3px}
#qr .bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
#qr .bar i{display:block;height:100%;background:var(--ac);animation:qgrow .6s ease-out}
#qr .jg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:6px}
#qr .jg div{border:1px solid var(--ln);border-radius:10px;padding:6px 0;text-align:center;line-height:1.15;color:var(--tx)}
#qr .jg div.dk{color:#fff}#qr .jg small{display:block;font-size:.62rem;opacity:.85}
#qr .ar{font-family:var(--qar);font-size:1.8rem;line-height:1.6;direction:rtl;text-align:center;color:var(--ac)}
:root[lang="ar"] #qr,:root[lang="ar"] #qr h2,:root[lang="ar"] #qr .big{font-family:var(--qar)}
#qr .li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);gap:8px}
#qr .li>span{min-width:0;overflow-wrap:anywhere}
#qr .err{color:#c0392b;font-size:.85rem;min-height:20px}
#qr table{width:100%;border-collapse:collapse;font-size:.9rem}#qr td,#qr th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}#qr tr.cur{background:var(--hl)}
@keyframes qin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes qgrow{from{width:0}}
#qr .qv.in{animation:qin .24s ease-out}
@media(prefers-reduced-motion:reduce){#qr *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-Fajr" viewBox="0 0 24 24"><path d="M19 13.5A7 7 0 1 1 9 4a5.5 5.5 0 0 0 10 9.5z M3 20h18"/></symbol>
<symbol id="i-Sunrise" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 4v6 M9.5 6.5L12 4l2.5 2.5"/></symbol>
<symbol id="i-Dhuhr" viewBox="0 0 24 24"><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-Asr" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 8v2 M5.5 12l1.5 1.2 M18.5 12l-1.5 1.2"/></symbol>
<symbol id="i-Maghrib" viewBox="0 0 24 24"><path d="M3 19h18 M7 19a5 5 0 0 1 10 0 M12 4v6 M9.5 7.5L12 10l2.5-2.5"/></symbol>
<symbol id="i-Isha" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z M17 3v3 M15.5 4.5h3"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8 M5 10v10h14V10 M10 20v-6h4v6"/></symbol>
<symbol id="i-qibla" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M16 8l-2 6-6 2 2-6z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4"/></symbol>
<symbol id="i-tools" viewBox="0 0 24 24"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></symbol>
<symbol id="i-quran" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13C17 4 14 4.5 12 6z M12 6v13"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h10 M18 7h2 M4 17h2 M10 17h10 M16 5v4 M8 15v4"/></symbol>
</defs></svg>
<main>
 <div class="card" data-tab="home">
  <div class="pill" id="cp"></div>
  <div class="hijri" id="hj">…</div><div class="greg" id="gr"></div>
 </div>
 <div class="card" data-tab="home">
  <div class="next">Next prayer</div>
  <div class="bigt" id="nt"></div>
  <div class="ring"><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="44"/><circle class="rf" id="rf" cx="50" cy="50" r="44" stroke-dasharray="276.5 276.5"/></svg><div class="rt"><b id="rh"></b><small>left</small></div></div>
  <div><span class="nn" id="nn">—</span></div>
 </div>
 <div class="f" id="dv" data-tab="home" style="margin-bottom:10px"><button data-o="0" class="act">Today</button><button data-o="1">Tomorrow</button></div>
 <div class="card" id="times" data-tab="home"></div>
 <details class="card" open data-tab="home"><summary>Voluntary prayers</summary><div id="vol"></div></details>
 <details class="card" open data-tab="home"><summary>Fasting</summary><div id="fs"></div></details>
 <details class="card" open data-tab="cal" id="evd"><summary>Islamic events</summary><div id="ev"></div></details>
 <details class="card" open data-tab="qibla" id="qb"><summary>Qibla</summary>
  <div style="text-align:center">
   <div style="position:relative;width:180px;height:180px;margin:10px auto;border:2px solid var(--ln);border-radius:50%">
    <div id="arr" style="position:absolute;inset:0;transition:transform .2s"><div style="position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:1.6rem">🕋</div><div style="position:absolute;left:50%;top:42px;bottom:50%;width:3px;margin-left:-1.5px;background:var(--ac);border-radius:2px"></div></div>
    <div style="position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--ac)"></div>
   </div>
   <div id="qd" style="font-weight:700"></div>
   <div id="qh" class="mu"></div>
   <button id="qc" type="button" style="margin-top:10px">Enable compass</button>
  </div>
 </details>
 <details class="card" open data-tab="cal"><summary>Hijri calendar</summary>
  <div class="hd"><button id="pv" type="button" aria-label="Previous month">‹</button><b id="mt"></b><button id="nx" type="button" aria-label="Next month">›</button></div>
  <div class="g" id="cal"></div>
 </details>
 <details class="card" open data-tab="cal" id="tt"><summary>Monthly timetable</summary>
  <div class="hd"><button id="tp" type="button" aria-label="Previous month">&lsaquo;</button><b id="ttm"></b><button id="tn" type="button" aria-label="Next month">&rsaquo;</button></div>
  <div id="ttb" style="overflow-x:auto"></div>
  <button id="tpr" type="button" style="margin-top:10px">Print</button>
 </details>
 <details class="card" open data-tab="set"><summary>Settings</summary>
  <details class="adv"><summary style="font-weight:400;color:var(--mu);font-size:.85rem">Advanced: coordinates</summary><div class="f">
   <div><label>Latitude</label><input id="lat" type="number" step="any" inputmode="decimal"></div>

function go(v){const ch=v!==view;view=v;anim=ch;draw();if(ch)scrollTo(0,0)}
const pos=(s,a)=>N[s-1]+" "+s+":"+a;
const opts=sel=>N.map((n,i)=>`<option value="${i+1}"${i+1===sel?" selected":""}>${i+1}. ${n} — ${AR[i]}</option>`).join("");
function draw(){
 const tabs=[["home","Today"],["log","Log"],["calendar","Calendar"],["ref","Progress"],["settings","More"]];
 const f={home,log,calendar,ref,settings}[view]||home;
 root.innerHTML=`<div class="f" style="margin-bottom:12px;flex-wrap:wrap">${tabs.map(([k,l])=>`<button type="button" data-v="${k}" class="${k===view?"act":""}">${l}</button>`).join("")}</div>`+`<div class="qv${anim?" in":""}">`+f()+"</div>";anim=false;if(view==="home")flash="";
 tx(root);if(view==="log")bindLog();if(view==="settings")bindSet();if(view==="calendar")bindCal();if(view==="ref")bindRef()}
root.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)go(b.dataset.v)});
const JS=J.map(p=>abs(p[0],p[1])),JE=J.map((p,i)=>i<29?JS[i+1]-1:6236);
function cover(){const c=new Uint8Array(6238);for(let i=1;i<=Math.min(Q.set.base||0,6236);i++)c[i]=1;
 Q.logs.forEach(l=>{if(l.t==="rev")return;const x=abs(l.s[0],l.s[1]),y=abs(l.e[0],l.e[1]);for(let i=x;i<=y;i++)c[i]=1});return c}
function stats(){if(memo.s)return memo.s;const c=cover();let n=0;for(let i=1;i<=6236;i++)n+=c[i];
 const jf=J.map((_,k)=>{let m=0;for(let i=JS[k];i<=JE[k];i++)m+=c[i];return m/(JE[k]-JS[k]+1)});return memo.s={n,pct:n/6236*100,jf}}
const juzDone=()=>new Set(stats().jf.map((f,i)=>f>=1?i+1:0).filter(Boolean));
function bestStreak(){const t=totals(),ds=Object.keys(t).sort();if(!ds.length)return 0;let run=0,best=0;
 for(let d=ds[0];d<=today();d=dAdd(d,1)){if((t[d]||0)>=Q.set.min){run++;best=Math.max(best,run)}else run=0}return best}
function planInfo(st){const p=Q.set.plan;if(!p)return"";
 const used=Math.max(0,Math.round((new Date(today()+"T12:00:00")-new Date(p.start+"T12:00:00"))/864e5)),left=Math.max(1,p.days-used),R=6236-st.n,end=dAdd(p.start,p.days-1);
 if(R<=0)return"Plan complete. Alhamdulillah.";const per=Math.ceil(R/left);
 return`Plan: finish by ${dl(end)}. ${R} ayahs left and ${left} ${left>1?"days":"day"} to go, so about ${per} ayahs a day (around ${rn(per*604/6236)} pages).`}
const AR="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const tm=l=>l.at?new Date(l.at).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",hour12:S.fm!=="24"}):"";
const hj=d=>hp(new Date(d+"T12:00:00")),hjs=d=>{const h=hj(d);return h.day+" "+HM[h.month-1]+" "+h.year};
const dl=d=>ld(new Date(d+"T12:00:00"),{weekday:"short",day:"numeric",month:"short"})+" · "+hjs(d);
const editable=d=>d>=dAdd(today(),-Q.set.edit)&&d<=today();
function entry(l,del){const ty=l.t==="mem"?"Memorizing · ":l.t==="rev"?"Revising · ":"";return`<div class="li"><span><b>${rng(l.s[0],l.s[1],l.e[0],l.e[1])}</b><br><span class="mut">${facts(l)}</span><br><span class="mut">${ty}Written at ${tm(l)}${l.note?" · “"+l.note.replace(/[<>&]/g,"")+"”":""}</span></span>${del?`<button class="x" type="button" data-del="${l.id}">Delete</button>`:""}</div>`}
function home(){
 const t=totals(),td=t[today()]||0,[s,a]=next(),n=abs(s,a),st=stats();
 const dl0=Q.logs.filter(l=>l.date===today()),pw=dl0.reduce((x,l)=>x+pgw(l),0);
 const wk=[...Array(7)].reduce((x,_,i)=>x+(t[dAdd(today(),-i)]||0),0);
 const mo=Object.entries(t).filter(([d])=>d.slice(0,7)===today().slice(0,7)).reduce((x,[,v])=>x+v,0);
 return`<div class="card"><div class="mut">Ayahs read today</div><div class="big">${td}</div>
 <div class="mut">${td?"About "+rn(pw)+(pw>1.05?" pages. ":" page. "):""}${td>=Q.set.min?"Today counts toward your streak.":"Read at least "+Q.set.min+" to keep your streak."}</div></div>
 <div class="qrow"><div class="card"><div class="gd" style="font-size:28px">${streak()}</div><div class="mut">day streak</div></div>
 <div class="card"><div style="font-size:28px">${wk}</div><div class="mut">last 7 days</div></div>
 <div class="card"><div style="font-size:28px">${mo}</div><div class="mut">this month</div></div></div>
 <div class="card"><div class="mut">Quran completed</div><div style="font-size:28px;font-family:Georgia,serif">${rn(st.pct)}%</div><div class="bar"><i style="width:${st.pct}%"></i></div><div class="mut">${6236-st.n} ayahs left${Q.set.base||Q.logs.length?"":". Set your starting point in Progress."}</div>${Q.set.plan?`<div class="mut" style="margin-top:6px">${planInfo(st)}</div>`:""}</div>
 <div class="card"><div class="mut">Continue from</div><div class="ar">${AR[s-1]}</div><div style="font-size:18px;font-family:Georgia,serif">${pos(s,a)}</div>
 <div class="mut">Page ${pageOf(n)} of 604 · Juz ${idx(J,n)} · Hizb ${idx(H,n)}</div><br><button type="button" data-v="log">Log reading</button></div>${flash?`<p class="gd">${flash}</p>`:""}`}

function log(){
 const [s,a]=next(),tdy=today();
 const days=[...Array(Q.set.edit+1)].map((_,i)=>dAdd(tdy,-i)),pick=days.includes(logDate)?logDate:tdy;
 const recent=Q.logs.filter(l=>l.date>=days[days.length-1]).sort((x,y)=>y.at-x.at);
 return`<div class="card">
 <label for="q_dt">Day</label><select id="q_dt">${days.map((d,i)=>`<option value="${d}"${d===pick?" selected":""}>${i?dl(d):"Today"}</option>`).join("")}</select>
 <label>Start</label><div class="qrow"><select id="q_s1" style="flex:2">${opts(s)}</select><input id="q_a1" type="number" inputmode="numeric" min="1" value="${a}" aria-label="Start ayah"></div>
 <label>End</label><div class="qrow"><select id="q_s2" style="flex:2">${opts(s)}</select><input id="q_a2" type="number" inputmode="numeric" min="1" placeholder="Ayah" aria-label="End ayah"></div>
 <label for="q_ty">Type</label><select id="q_ty"><option value="read">Reading</option><option value="mem">Memorizing</option><option value="rev">Revising (not counted in completion)</option></select>
 <label for="q_nt">Note (optional)</label><input id="q_nt" maxlength="80" placeholder="For example: after Fajr" autocomplete="off">
 <div id="q_pv" class="mut" style="margin-top:10px;min-height:44px"></div><p id="q_er" class="err"></p><button id="q_sv" type="button">Save</button></div>
 <h2>Recent entries</h2>${recent.length?recent.map(l=>entry(l,true)).join(""):'<p class="mut">Nothing logged yet. Pick where you stopped and add your end ayah.</p>'}`}
function bindLog(){
 const g=id=>qs("#q_"+id),v=id=>+g(id).value;
 const mk=()=>({s:[v("s1"),v("a1")],e:[v("s2"),v("a2")]});
 const upd=()=>{const e=g("a2").value;if(!e){g("pv").textContent="";g("er").textContent="";return}
  const err=validate(v("s1"),v("a1"),v("s2"),v("a2"));g("er").textContent=err;
  if(err){g("pv").textContent="";return}
  const l=mk();l.n=count(l.s[0],l.s[1],l.e[0],l.e[1]);g("pv").innerHTML="<b>"+rng(l.s[0],l.s[1],l.e[0],l.e[1])+"</b><br>"+facts(l)};
 ["s1","a1","s2","a2"].forEach(i=>g(i).addEventListener("input",upd));
 g("s1").addEventListener("change",()=>{if(!g("a2").value)g("s2").value=g("s1").value});
 g("sv").onclick=()=>{const err=g("a2").value?validate(v("s1"),v("a1"),v("s2"),v("a2")):"Enter the end ayah.";
  if(err){g("er").textContent=err;return}
  const l=mk(),b4=juzDone(),n4=stats().n;
  Q.logs.push({id:Date.now()+""+Math.random().toString(36).slice(2,6),date:g("dt").value,s:l.s,e:l.e,n:count(l.s[0],l.s[1],l.e[0],l.e[1]),t:g("ty").value,note:g("nt").value.trim(),at:Date.now()});
  const nw=[...juzDone()].filter(x=>!b4.has(x));
  flash=stats().n>=6236&&n4<6236?"Khatma complete. Alhamdulillah.":nw.length?"Saved. Juz "+nw.join(", ")+" complete.":"Saved.";
  logDate=null;qsave();go("home")};
 bindDel()}
function bindDel(){root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{Q.logs=Q.logs.filter(l=>l.id!==b.dataset.del);qsave();draw()})}

function hmr(y,m,dim){const a=hp(new Date(y,m,1,12)),b=hp(new Date(y,m,dim,12));
 return a.month===b.month&&a.year===b.year?HM[a.month-1]+" "+a.year:HM[a.month-1]+(a.year!==b.year?" "+a.year:"")+" – "+HM[b.month-1]+" "+b.year}
function calendar(){
 const y=cal.getFullYear(),m=cal.getMonth(),ym=y+"-"+pad(m+1),t=totals(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),min=Q.set.min;
 if(!sel||sel.slice(0,7)!==ym)sel=today().slice(0,7)===ym?today():null;
 let h=["Sa","Su","Mo","Tu","We","Th","Fr"].map(d=>`<div class="qhd">${d}</div>`).join("")+"<div></div>".repeat((first+1)%7),days=0,tot=0;
 for(let d=1;d<=dim;d++){const k=ym+"-"+pad(d),n=t[k]||0;if(n>=min)days++;tot+=n;
  const c=n>=min*8?"l3":n>=min*3?"l2":n>=min?"l1":n?"some":"";
  h+=`<button type="button" class="qd ${c}${k===today()?" today":""}${k===sel?" sel":""}" data-day="${k}" aria-label="${dl(k)}: ${n} ayahs"><span>${d}</span><small class="qh">${hj(k).day}</small>${n?`<small>${n}</small>`:""}</button>`}
 let det="";
 if(sel){const ls=Q.logs.filter(l=>l.date===sel).sort((x,y)=>x.at-y.at),pgs=new Set();
  ls.forEach(l=>{for(let p=pageOf(abs(l.s[0],l.s[1]));p<=pageOf(abs(l.e[0],l.e[1]));p++)pgs.add(p)});
  det=`<div class="card"><b>${dl(sel)}</b>${ls.length?`<div class="mut">${t[sel]} ayahs · ${pgs.size} ${pgs.size>1?"pages":"page"} touched</div>${ls.map(l=>entry(l,editable(sel))).join("")}`:'<p class="mut">Nothing logged on this day.</p>'}${editable(sel)?`<br><button type="button" class="sec" data-logday="${sel}">Log reading for this day</button>`:""}</div>`}
 return`<div class="qrow" style="margin-bottom:10px"><button class="sec" type="button" id="q_pm" aria-label="Previous month" style="flex:0 0 52px">‹</button><b style="text-align:center">${cal.toLocaleString("en",{month:"long",year:"numeric"})}<br><span class="mut" style="font-weight:400">${hmr(y,m,dim)}</span></b><button class="sec" type="button" id="q_nm" aria-label="Next month" style="flex:0 0 52px">›</button></div>
 <div class="card"><div class="qcal">${h}</div><div class="mut" style="margin-top:10px">${days} days read · ${tot} ayahs. Small number = Hijri day. Darker boxes mean more ayahs. Tap a day for details.</div></div>${det}`}
function bindCal(){
 qs("#q_pm").onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);draw()};
 qs("#q_nm").onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);draw()};
 root.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{sel=b.dataset.day;draw()});
 root.querySelectorAll("[data-logday]").forEach(b=>b.onclick=()=>{logDate=b.dataset.logday;go("log")});
 bindDel()}

function ref(){
 const st=stats(),[s,a]=next(),cur=idx(J,abs(s,a)),f=p=>p[0]+":"+p[1],pg=p=>pageOf(abs(p[0],p[1])),bs=Q.set.base||0,p=Q.set.plan;
 const bsp=bs?fromAbs(bs):null;
 return`<div class="card"><div class="mut">Quran completed</div><div class="big">${rn(st.pct)}%</div><div class="bar"><i style="width:${st.pct}%"></i></div>
 <div class="mut">${st.n} of 6236 ayahs done · ${6236-st.n} left. Revising and re-reading are not counted here.</div><div class="mut" style="margin-top:6px">Best streak: ${bestStreak()} days · Current: ${streak()}</div></div>
 <div class="card"><b>Starting point</b><p class="mut">Already read part of the Quran before using this app? Set where you reached. Everything before it counts as done.${bsp?" Now: up to "+pos(bsp[0],bsp[1])+".":""}</p>
 <div class="qrow"><select id="q_bs" style="flex:2">${opts(bsp?bsp[0]:1)}</select><input id="q_ba" type="number" inputmode="numeric" min="1" placeholder="Ayah" value="${bsp?bsp[1]:""}" aria-label="Last ayah read"></div>
 <p id="q_be" class="err"></p><div class="qrow"><button type="button" id="q_bset">Save starting point</button><button type="button" class="sec" id="q_bclr">Clear</button></div></div>
 <div class="card"><b>Finish plan</b><p class="mut">${p?planInfo(st):"Choose how many days you want to take to finish the Quran. Use 30 for Ramadan."}</p>
 <label for="q_pd">Days to finish</label><input id="q_pd" type="number" inputmode="numeric" min="1" max="1000" value="${p?p.days:30}">
 <br><br><div class="qrow"><button type="button" id="q_pset">${p?"Restart plan today":"Start plan today"}</button>${p?'<button type="button" class="sec" id="q_pclr">Remove plan</button>':""}</div></div>
 <h2>Juz progress</h2><div class="jg">${st.jf.map((fr,i)=>`<div class="${fr>=.6?"dk":""}" style="background:color-mix(in srgb,var(--ac) ${Math.round(fr*100)}%,var(--card))"><b>${i+1}</b><small>${Math.floor(fr*100)}%</small></div>`).join("")}</div>
 <h2>Juz and hizb</h2><p class="mut">Where each part starts. Your next ayah is in juz ${cur}. Pages follow the 604-page Madinah mushaf.</p>
 <div class="card" style="overflow-x:auto"><table><tr><th>Juz</th><th>Starts</th><th>Page (of 604)</th><th>Hizb</th></tr>${J.map((p,i)=>`<tr class="${i+1===cur?"cur":""}"><td>${i+1}</td><td>${f(p)}</td><td>${pg(p)}</td><td>${2*i+1}, ${2*i+2} (${f(H[2*i+1])})</td></tr>`).join("")}</table></div>`}
function bindRef(){
 qs("#q_bset").onclick=()=>{const s=+qs("#q_bs").value,a=+qs("#q_ba").value;
  if(!Number.isInteger(a)||a<1||a>C[s-1]){qs("#q_be").textContent=N[s-1]+" has "+C[s-1]+" ayahs. Enter a number from 1 to "+C[s-1]+".";return}
  Q.set.base=abs(s,a);qsave();draw()};
 qs("#q_bclr").onclick=()=>{Q.set.base=0;qsave();draw()};
 qs("#q_pset").onclick=()=>{const d=Math.max(1,Math.min(1000,Math.round(+qs("#q_pd").value)||30));Q.set.plan={days:d,start:today()};qsave();draw()};
 const pc=qs("#q_pclr");if(pc)pc.onclick=()=>{Q.set.plan=null;qsave();draw()}}

function settings(){const s=Q.set;
 return`<div class="card"><b>Streak and entries</b>
 <label for="q_mn">Daily minimum (ayahs) to keep the streak</label><input id="q_mn" type="number" min="1" value="${s.min}">
 <label for="q_gr">Grace day (one missed day per week is forgiven)</label><select id="q_gr"><option value="1"${s.grace?" selected":""}>On</option><option value="0"${s.grace?"":" selected"}>Off</option></select>
 <label for="q_ed">Days you can add or delete entries</label><select id="q_ed"><option${s.edit===3?" selected":""}>3</option><option${s.edit===7?" selected":""}>7</option></select></div>
 <div class="card"><b>Reminders</b><p class="mut">Use Tools, then Reminders, to set a reading reminder, for example 10 minutes after Fajr with the label Read Quran.</p></div>
 <div class="card"><b>Backup</b><p class="mut">Quran data is saved only on this phone. Copy it somewhere safe, and paste it back to restore.</p>
 <textarea id="q_bk" aria-label="Backup data">${JSON.stringify(Q)}</textarea><br><br><div class="qrow"><button class="sec" id="q_cb" type="button">Copy backup</button><button id="q_rs" type="button">Restore from text</button></div><p id="q_er" class="err"></p></div>`}
function bindSet(){
 const sv=()=>{Q.set=Object.assign({},Q.set,{min:Math.max(1,+qs("#q_mn").value||1),grace:qs("#q_gr").value==="1",edit:+qs("#q_ed").value});qsave()};
 ["q_mn","q_gr","q_ed"].forEach(i=>qs("#"+i).addEventListener("change",sv));
 qs("#q_cb").onclick=async e=>{try{await navigator.clipboard.writeText(qs("#q_bk").value)}catch(x){qs("#q_bk").select();try{document.execCommand("copy")}catch(_){}}e.target.textContent="Copied"};
 qs("#q_rs").onclick=()=>{try{const o=JSON.parse(qs("#q_bk").value);if(!Array.isArray(o.logs)||!o.set)throw 0;Q=o;qsave();flash="Restored.";go("home")}catch(e){qs("#q_er").textContent="That text is not a valid backup."}}}
let lt="";
return{show(){if(!cal)cal=new Date(today()+"T12:00:00");flash="";anim=true;lt=today();draw()},redraw(){if(cal)draw()},
 tick(){const t=today();if(t!==lt){lt=t;if(curTab==="quran")draw()}}}

})();
// ---------- start ----------
fillForm();applyLg();render();renderCal();showTab('home');
let lastK=Math.floor(Date.now()/6e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastK=Math.floor(Date.now()/6e4);render()}});
setInterval(()=>{if(document.hidden)return;const n=Date.now(),k=Math.floor(n/6e4);if(k!==lastK||(nextAtMs&&n>=nextAtMs)){lastK=k;render()}},1000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
